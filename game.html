
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BREACH SURVIVAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10130f;color:#fff;font-family:Arial,sans-serif}
#game{height:740px;position:relative;overflow:hidden;background:#66715f}
canvas{display:block;width:100%;height:100%;outline:none}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90%);padding:25px;background:#10150fee;border:1px solid #b6d68a;text-align:center}
#panel h1{letter-spacing:2px}
#panel p{color:#c0c9b8;line-height:1.6;font-size:13px}
button{border:0;background:#b6d68a;color:#172010;padding:13px 25px;font-weight:bold;cursor:pointer}
#brand{position:absolute;top:14px;left:16px;font-weight:900;letter-spacing:2px;pointer-events:none}
#brand span{color:#b6d68a}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#10130fdc;padding:10px;white-space:nowrap;font-size:12px;pointer-events:none}
#help{position:absolute;top:14px;right:14px;text-align:right;line-height:1.8;font-size:11px;color:#fff;background:#10130f99;padding:8px;pointer-events:none}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#e6f4d0}
#cross:before{left:7px;width:2px;height:16px}
#cross:after{top:7px;height:2px;width:16px}
#stats,#ammo{position:absolute;bottom:14px;background:#10130fe8;padding:10px 14px;border:1px solid #ffffff35;pointer-events:none}
#stats{left:14px}
#ammo{right:14px;text-align:right}
.small{font-size:10px;letter-spacing:1px;color:#bdc8b3}
.big{font-size:25px;font-weight:900;margin-top:4px}
#bar{height:5px;background:#4c5545;width:140px;margin-top:5px}
#fill{height:100%;width:100%;background:#b6d68a}
#msg{position:absolute;top:65px;left:50%;transform:translateX(-50%);font-size:12px;color:#e9f1df;pointer-events:none}
</style>
</head>
<body>
<div id="game">
  <div id="brand">NEON BREACH <span>SURVIVAL</span></div>
  <div id="top">적 <b id="count">5</b>명　|　남은 시간 <b id="timer">120</b>초</div>
  <div id="help">WASD 이동 · 마우스 조준<br>왼쪽 클릭 사격 · R 재장전<br>Shift 달리기 · Q 대시 · Esc 일시정지</div>
  <div id="cross"></div>
  <div id="msg">훈련 구역</div>
  <div id="stats"><div class="small">HEALTH</div><div class="big" id="hp">100</div><div id="bar"><div id="fill"></div></div></div>
  <div id="ammo"><div class="small">ASSAULT RIFLE</div><div class="big"><span id="mag">30</span> <span class="small">/ <span id="reserve">120</span></span></div></div>
  <div id="panel">
    <h1>NEON BREACH</h1>
    <p>현실적인 전장 분위기의 1인칭 FPS 훈련입니다.</p>
    <p>WASD로 이동하고 마우스로 적을 조준하세요.</p>
    <button id="start">훈련 시작</button>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ba69b);
scene.fog=new THREE.Fog(0x9ba69b,45,110);

const camera=new THREE.PerspectiveCamera(
  75,root.clientWidth/root.clientHeight,.1,150
);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(root.clientWidth,root.clientHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
root.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe2eadc,0x42483c,2));
const sun=new THREE.DirectionalLight(0xfff1d9,2.3);
sun.position.set(-20,35,15);
sun.castShadow=true;
scene.add(sun);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({
  color:c,roughness:r,metalness:m
});
const groundMat=mat(0x59604d);
const wallMat=mat(0x74776b);
const crateMat=mat(0x55594e,.6,.25);
const trunkMat=mat(0x594532);
const leafMat=mat(0x405637);
const leaf2Mat=mat(0x586b45);
const gunMat=mat(0x252a28,.35,.6);
const botMat=mat(0x42483e);
const vestMat=mat(0x33382f);
const skinMat=mat(0xa99e8a);
const redMat=mat(0x8d3228);

function box(x,y,z,w,h,d,material){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  o.position.set(x,y,z);
  o.castShadow=true;
  o.receiveShadow=true;
  scene.add(o);
  return o;
}

box(0,-.3,0,100,.6,100,groundMat);

const obstacles=[];
function obstacle(x,y,z,w,h,d,material){
  const o=box(x,y,z,w,h,d,material);
  obstacles.push({x,z,w,d});
  return o;
}

obstacle(0,2,-49,100,4,1,wallMat);
obstacle(0,2,49,100,4,1,wallMat);
obstacle(-49,2,0,1,4,100,wallMat);
obstacle(49,2,0,1,4,100,wallMat);

function building(x,z,w,d){
  obstacle(x,2,z,w,4,d,wallMat);
  box(x,4.1,z,w+.2,.2,d+.2,crateMat);
  box(x-w*.2,1.1,z+d/2+.06,1,2.2,.08,crateMat);
  box(x+w*.2,2.6,z+d/2+.06,1.3,.8,.08,mat(0x29332e,.3));
}
building(-21,-20,12,10);
building(20,-23,13,10);
building(22,17,12,9);
building(-23,20,11,10);
building(2,-33,10,7);

[
  [-8,1,-12,7,2,3],[8,1,-7,6,2,3],
  [-14,1,5,5,2,3],[14,1,6,5,2,3],
  [0,1,15,7,2,3],[-5,1,30,5,2,3],
  [30,1,-4,5,2,3],[-31,1,-5,5,2,3],
  [5,1,35,6,2,3]
].forEach(p=>obstacle(...p,crateMat));

function tree(x,z,s=1){
  const t=new THREE.Mesh(
    new THREE.CylinderGeometry(.18*s,.32*s,2.8*s,7),trunkMat
  );
  t.position.set(x,1.4*s,z);
  t.castShadow=true;
  scene.add(t);

  for(let i=0;i<3;i++){
    const crown=new THREE.Mesh(
      new THREE.ConeGeometry((1.45-i*.18)*s,2*s,7),
      i%2?leafMat:leaf2Mat
    );
    crown.position.set(x,(2.7+i*.65)*s,z);
    crown.castShadow=true;
    scene.add(crown);
  }
  obstacles.push({x,z,w:.7*s,d:.7*s});
}
for(let i=0;i<40;i++){
  const x=(Math.random()-.5)*88;
  const z=(Math.random()-.5)*88;
  if(Math.abs(x)<15&&z>0)continue;
  tree(x,z,.8+Math.random()*.5);
}

// First-person rifle.
camera.position.set(0,1.7,38);
camera.rotation.set(0,Math.PI,0);
scene.add(camera);

const gun=new THREE.Group();
camera.add(gun);

const body=new THREE.Mesh(
  new THREE.BoxGeometry(.24,.2,.72),gunMat
);
body.position.set(.32,-.29,-.55);
gun.add(body);

const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.03,.04,.52,12),mat(0x151817,.3,.7)
);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.32,-.24,-1);
gun.add(barrel);

const sight=new THREE.Mesh(
  new THREE.BoxGeometry(.06,.07,.1),gunMat
);
sight.position.set(.32,-.15,-.7);
gun.add(sight);

const magazine=new THREE.Mesh(
  new THREE.BoxGeometry(.11,.24,.14),gunMat
);
magazine.position.set(.32,-.47,-.48);
gun.add(magazine);

const muzzle=new THREE.PointLight(0xffd6a0,0,4);
muzzle.position.set(.32,-.24,-1.3);
gun.add(muzzle);

const player={
  x:0,z:38,yaw:Math.PI,pitch:0,
  hp:100,mag:30,reserve:120,
  lastShot:0,reloading:false,dash:0,recoil:0
};

const bots=[];
function spawnBot(x,z){
  const b=new THREE.Group();
  b.position.set(x,0,z);

  const torso=new THREE.Mesh(
    new THREE.CapsuleGeometry(.32,.68,4,8),botMat
  );
  torso.position.y=1.1;
  b.add(torso);

  const vest=new THREE.Mesh(
    new THREE.BoxGeometry(.5,.44,.3),vestMat
  );
  vest.position.set(0,1.18,.02);
  b.add(vest);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.2,12,10),skinMat
  );
  head.position.y=1.7;
  b.add(head);

  const helmet=new THREE.Mesh(
    new THREE.SphereGeometry(.23,12,8,0,Math.PI*2,0,Math.PI/2),
    crateMat
  );
  helmet.position.y=1.8;
  b.add(helmet);

  for(const side of [-1,1]){
    const arm=new THREE.Mesh(
      new THREE.CapsuleGeometry(.09,.4,3,6),botMat
    );
    arm.position.set(side*.38,1.12,.05);
    b.add(arm);

    const leg=new THREE.Mesh(
      new THREE.CapsuleGeometry(.11,.44,3,6),crateMat
    );
    leg.position.set(side*.15,.43,0);
    b.add(leg);
  }

  b.userData={hp:100,alive:true,fire:1+Math.random()*2};
  scene.add(b);
  bots.push(b);

  b.traverse(o=>{
    if(o.isMesh)o.userData.ownerBot=b;
  });
}

function spawnAll(){
  bots.forEach(b=>scene.remove(b));
  bots.length=0;
  [
    [-16,-28],[15,-30],[29,7],[-30,9],[2,-8]
  ].forEach(p=>spawnBot(...p));
}

const keys={};
let running=false,locked=false,firing=false,time=120;
let lastFrame=performance.now();
const panel=document.querySelector('#panel');

function showPanel(title,desc,buttonText,action){
  panel.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="start">${buttonText}</button>`;
  panel.style.display='block';
  document.querySelector('#start').onclick=action;
}
function begin(){
  running=true;
  panel.style.display='none';
  renderer.domElement.requestPointerLock();
  lastFrame=performance.now();
}
document.querySelector('#start').onclick=begin;

document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===renderer.domElement;
});
document.addEventListener('mousemove',e=>{
  if(!running||!locked)return;
  player.yaw-=e.movementX*.002;
  player.pitch-=e.movementY*.002;
  player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch));
  camera.rotation.set(player.pitch,player.yaw,0);
});

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='KeyQ'&&running&&player.dash<=0)player.dash=.22;
  if(e.code==='Escape'&&running){
    running=false;
    firing=false;
    showPanel('PAUSED','일시정지되었습니다.','계속하기',begin);
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

renderer.domElement.addEventListener('mousedown',e=>{
  if(e.button!==0||!running)return;
  if(!locked){
    renderer.domElement.requestPointerLock();
    return;
  }
  firing=true;
  shoot();
});
document.addEventListener('mouseup',()=>firing=false);

function updateHud(){
  document.querySelector('#hp').textContent=Math.max(0,Math.round(player.hp));
  document.querySelector('#fill').style.width=Math.max(0,player.hp)+'%';
  document.querySelector('#mag').textContent=player.mag;
  document.querySelector('#reserve').textContent=player.reserve;
  document.querySelector('#count').textContent=bots.filter(b=>b.userData.alive).length;
}

function reload(){
  if(!running||player.reloading||player.mag===30||player.reserve<=0)return;
  player.reloading=true;
  setTimeout(()=>{
    const amount=Math.min(30-player.mag,player.reserve);
    player.mag+=amount;
    player.reserve-=amount;
    player.reloading=false;
    updateHud();
  },1000);
}

const raycaster=new THREE.Raycaster();
function shoot(){
  const now=performance.now();
  if(!running||!locked||player.reloading)return;
  if(now-player.lastShot<140)return;
  if(player.mag<=0){reload();return;}

  player.lastShot=now;
  player.mag--;
  player.recoil=Math.min(player.recoil+.025,.12);
  muzzle.intensity=3;
  setTimeout(()=>muzzle.intensity=0,45);

  camera.updateMatrixWorld(true);
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  raycaster.near=0;
  raycaster.far=100;

  const targets=[];
  bots.filter(b=>b.userData.alive).forEach(b=>{
    b.traverse(o=>{
      if(o.isMesh){
        o.userData.ownerBot=b;
        targets.push(o);
      }
    });
  });

  const hits=raycaster.intersectObjects(targets,false);
  if(hits.length){
    const bot=hits[0].object.userData.ownerBot;
    if(bot&&bot.userData.alive){
      bot.userData.hp-=40;
      if(bot.userData.hp<=0){
        bot.userData.alive=false;
        scene.remove(bot);
      }
    }
  }

  updateHud();

  if(bots.every(b=>!b.userData.alive)){
    running=false;
    firing=false;
    document.exitPointerLock();
    showPanel('AREA CLEARED','모든 적을 제압했습니다!','다시 시작',reset);
  }
}

function blocked(x,z){
  return obstacles.some(o=>
    Math.abs(x-o.x)<o.w/2+.35&&
    Math.abs(z-o.z)<o.d/2+.35
  );
}

function reset(){
  player.x=0;
  player.z=38;
  player.yaw=Math.PI;
  player.pitch=0;
  player.hp=100;
  player.mag=30;
  player.reserve=120;
  player.reloading=false;
  player.dash=0;
  player.recoil=0;
  camera.position.set(0,1.7,38);
  camera.rotation.set(0,Math.PI,0);
  time=120;
  spawnAll();
  updateHud();
  begin();
}

function update(dt){
  if(!running)return;

  time-=dt;
  document.querySelector('#timer').textContent=Math.ceil(time);
  if(time<=0){
    running=false;
    firing=false;
    document.exitPointerLock();
    showPanel('TIME UP','훈련 시간이 종료되었습니다.','다시 시작',reset);
    return;
  }

  // Movement is aligned with the camera's horizontal direction.
  const forward=new THREE.Vector3(
    -Math.sin(player.yaw),0,-Math.cos(player.yaw)
  );
  const right=new THREE.Vector3(
    Math.cos(player.yaw),0,-Math.sin(player.yaw)
  );

  let dx=0,dz=0;
  if(keys.KeyW){dx+=forward.x;dz+=forward.z;}
  if(keys.KeyS){dx-=forward.x;dz-=forward.z;}
  if(keys.KeyD){dx+=right.x;dz+=right.z;}
  if(keys.KeyA){dx-=right.x;dz-=right.z;}

  const len=Math.hypot(dx,dz);
  if(len>0){dx/=len;dz/=len;}

  const speed=(keys.ShiftLeft?8:5)*(player.dash>0?2.5:1);
  dx*=speed*dt;
  dz*=speed*dt;
  player.dash=Math.max(0,player.dash-dt);

  // Separate axis collision keeps the player from sticking at corners.
  if(!blocked(player.x+dx,player.z))player.x+=dx;
  if(!blocked(player.x,player.z+dz))player.z+=dz;

  player.x=Math.max(-47,Math.min(47,player.x));
  player.z=Math.max(-47,Math.min(47,player.z));
  camera.position.set(player.x,1.7,player.z);

  bots.forEach(b=>{
    if(!b.userData.alive)return;
    const data=b.userData;
    const vx=player.x-b.position.x;
    const vz=player.z-b.position.z;
    const dist=Math.hypot(vx,vz);

    if(dist>5&&dist<35){
      const nx=b.position.x+vx/dist*dt;
      const nz=b.position.z+vz/dist*dt;
      if(!blocked(nx,b.position.z))b.position.x=nx;
      if(!blocked(b.position.x,nz))b.position.z=nz;
    }

    b.rotation.y=Math.atan2(vx,vz);
    data.fire-=dt;
    if(dist<23&&data.fire<=0){
      data.fire=1.4+Math.random()*1.5;
      if(Math.random()<.18){
        player.hp-=7;
        updateHud();
        if(player.hp<=0){
          player.hp=0;
          running=false;
          firing=false;
          document.exitPointerLock();
          updateHud();
          showPanel('ELIMINATED','전투에서 패배했습니다.','다시 시작',reset);
        }
      }
    }
  });

  if(firing&&locked)shoot();

  player.recoil=Math.max(0,player.recoil-dt*.2);
  gun.position.z=-player.recoil;
  gun.position.y=len>0?Math.sin(performance.now()*.012)*.012:0;
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.04,(now-lastFrame)/1000);
  lastFrame=now;
  update(dt);
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=root.clientWidth/root.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(root.clientWidth,root.clientHeight);
});

spawnAll();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>

</script>
</body>
</html>
