
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BREACH</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:740px;overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:none}
#hud{position:absolute;inset:0;pointer-events:none}
.brand{position:absolute;top:15px;left:18px;font-weight:900;font-size:20px}
.brand span{color:#d7ff55}
#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#080b12dd;border:1px solid #ffffff33;border-radius:8px;white-space:nowrap}
#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#d7ff55}
#cross:before{left:7px;width:2px;height:16px}
#cross:after{top:7px;width:16px;height:2px}
#help{position:absolute;right:15px;top:15px;text-align:right;font-size:12px;line-height:1.8;color:#d2d9e5}
#stats{position:absolute;left:16px;bottom:15px;background:#080b12dd;padding:12px;border:1px solid #ffffff33;border-radius:7px}
#ammo{position:absolute;right:16px;bottom:15px;text-align:right;background:#080b12dd;padding:12px;border-radius:7px}
.big{font-size:25px;font-weight:900}
.small{font-size:11px;color:#aab8cb;letter-spacing:1px}
#panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,90%);padding:25px;text-align:center;background:#0b111eF2;border:1px solid #d7ff55;border-radius:10px}
#panel h1{margin:0 0 12px;letter-spacing:3px}
#panel p{color:#b8c4d5;line-height:1.6}
button{background:#d7ff55;color:#111827;font-weight:900;border:0;border-radius:5px;padding:12px 24px;cursor:pointer}
#toast{position:absolute;top:68px;left:50%;transform:translateX(-50%);color:#d7ff55;font-weight:bold}
</style>
</head>
<body>
<div id="game">
  <div class="brand">NEON <span>BREACH</span></div>
  <div id="top">BLUE <b id="score">0</b> : 0 RED　 |　 <span id="time">90</span>s</div>
  <div id="cross"></div>
  <div id="help">WASD 이동<br>마우스 조준<br>왼쪽 클릭 사격<br>R 재장전 · Q 대시<br>ESC 일시정지</div>
  <div id="toast">훈련 구역 · 적 <span id="left">5</span>명</div>
  <div id="stats"><div class="small">HEALTH</div><div class="big" id="hp">100</div></div>
  <div id="ammo"><div class="small">NB-7 ASSAULT</div><div class="big"><span id="mag">25</span> <span class="small">/ <span id="reserve">100</span></span></div><div class="small">AMMO</div></div>
  <div id="panel">
    <h1>NEON BREACH</h1>
    <p>적 봇을 모두 제압해 라운드에서 승리하세요.</p>
    <p>WASD 이동 · 마우스 조준 · 클릭 사격</p>
    <button id="start">훈련 시작</button>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9aaec2);
scene.fog=new THREE.Fog(0x9aaec2,30,75);

const camera=new THREE.PerspectiveCamera(
  75,root.clientWidth/root.clientHeight,0.1,100
);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(root.clientWidth,root.clientHeight);
renderer.shadowMap.enabled=true;
root.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeaff,0x343e4d,2));
const light=new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(-10,20,10);
light.castShadow=true;
scene.add(light);

const material=(color,metalness=0,roughness=.7)=>
 new THREE.MeshStandardMaterial({color,metalness,roughness});

const floorMat=material(0x485361);
const wallMat=material(0x293544,.3);
const crateMat=material(0x5b6877,.2);
const neonMat=new THREE.MeshStandardMaterial({
 color:0xd7ff55,emissive:0x7c941f,emissiveIntensity:1
});
const redMat=new THREE.MeshStandardMaterial({
 color:0xff3655,emissive:0x60101c,emissiveIntensity:.5
});

const blockers=[];
function block(x,y,z,w,h,d,mat,collide=true){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 if(collide)blockers.push({x,z,w,h,d});
 return mesh;
}

block(0,-.25,0,64,.5,64,floorMat,false);
block(0,2,-32,64,4,1,wallMat);
block(0,2,32,64,4,1,wallMat);
block(-32,2,0,1,4,64,wallMat);
block(32,2,0,1,4,64,wallMat);

for(let i=-28;i<=28;i+=4){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.025,.01,60),
  material(0x687786)
 );
 line.position.set(i,.01,0);
 scene.add(line);
}

[
 [-12,1,-12,5,2,4],[-20,1,-2,4,2,5],
 [-3,1,-3,4,2,4],[10,1,-13,5,2,4],
 [17,1,-3,4,2,5],[8,1,9,5,2,4],
 [-8,1,12,5,2,4],[-22,1,16,4,2,4],
 [20,1,16,5,2,4],[0,1,23,6,2,3],
 [24,1,7,3,2,5],[-24,1,-16,4,2,4]
].forEach(a=>block(...a,crateMat));

for(let x=-24;x<=24;x+=16){
 block(x,3,-25,6,6,3,wallMat);
 const strip=new THREE.Mesh(
  new THREE.BoxGeometry(3,.08,.08),neonMat
 );
 strip.position.set(x,4.5,-23.4);
 scene.add(strip);
}

const player={
 x:0,z:27,yaw:Math.PI,pitch:0,
 hp:100,mag:25,reserve:100,
 lastShot:0,dash:0
};
camera.position.set(0,1.7,27);

const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

const gunMat=material(0x172332,.8,.3);
const gunBody=new THREE.Mesh(
 new THREE.BoxGeometry(.28,.22,.75),gunMat
);
gunBody.position.set(.32,-.28,-.55);
gun.add(gunBody);

const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(.035,.045,.45,10),gunMat
);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.32,-.23,-1);
gun.add(barrel);

const gunLine=new THREE.Mesh(
 new THREE.BoxGeometry(.06,.035,.32),neonMat
);
gunLine.position.set(.32,-.15,-.6);
gun.add(gunLine);

const bots=[];
function spawnBot(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);

 const torso=new THREE.Mesh(
  new THREE.CapsuleGeometry(.35,.7,4,8),
  material(0x263445)
 );
 torso.position.y=1.1;
 group.add(torso);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.22,12,10),
  material(0xc8d3df)
 );
 head.position.y=1.7;
 group.add(head);

 const visor=new THREE.Mesh(
  new THREE.BoxGeometry(.32,.08,.06),redMat
 );
 visor.position.set(0,1.72,.2);
 group.add(visor);

 const marker=new THREE.Mesh(
  new THREE.ConeGeometry(.12,.2,4),redMat
 );
 marker.position.y=2.15;
 group.add(marker);

 group.userData={
  hp:100,alive:true,fire:1+Math.random()*2
 };
 scene.add(group);
 bots.push(group);
}
function spawnAll(){
 bots.forEach(b=>scene.remove(b));
 bots.length=0;
 [
  [-12,-20],[13,-21],[23,10],[-23,8],[1,-8]
 ].forEach(p=>spawnBot(...p));
}

const keys={};
let running=false,locked=false,score=0;
let time=90,last=performance.now();

const panel=document.querySelector('#panel');
const startButton=document.querySelector('#start');

function showPanel(title,desc,button,action){
 panel.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="start">${button}</button>`;
 document.querySelector('#start').onclick=action;
 panel.style.display='block';
}
function begin(){
 running=true;
 panel.style.display='none';
 renderer.domElement.requestPointerLock();
 last=performance.now();
}
startButton.onclick=begin;

document.addEventListener('pointerlockchange',()=>{
 locked=document.pointerLockElement===renderer.domElement;
});
document.addEventListener('mousemove',e=>{
 if(!running||!locked)return;
 player.yaw-=e.movementX*.002;
 player.pitch-=e.movementY*.002;
 player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch));
 camera.rotation.set(player.pitch,player.yaw,0);
});
document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='KeyR')reload();
 if(e.code==='KeyQ'&&running)player.dash=.22;
 if(e.code==='Escape'&&running){
  running=false;
  showPanel('PAUSED','게임이 일시정지되었습니다.','계속하기',begin);
 }
});
document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{
 if(running&&!locked)renderer.domElement.requestPointerLock();
 else if(running&&locked)shoot();
});

function hud(){
 document.querySelector('#hp').textContent=Math.max(0,player.hp);
 document.querySelector('#mag').textContent=player.mag;
 document.querySelector('#reserve').textContent=player.reserve;
 document.querySelector('#score').textContent=score;
 document.querySelector('#left').textContent=bots.filter(b=>b.userData.alive).length;
}

function reload(){
 if(player.mag===25||player.reserve<=0)return;
 const button=document.querySelector('#mag');
 button.textContent='...';
 setTimeout(()=>{
  const n=Math.min(25-player.mag,player.reserve);
  player.mag+=n;
  player.reserve-=n;
  hud();
 },850);
}

const raycaster=new THREE.Raycaster();
function shoot(){
 const now=performance.now();
 if(now-player.lastShot<160)return;
 if(player.mag<=0){reload();return;}
 player.lastShot=now;
 player.mag--;
 hud();

 gun.position.z=.06;
 setTimeout(()=>gun.position.z=0,50);

 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 raycaster.far=65;

 const targets=[];
 bots.filter(b=>b.userData.alive).forEach(b=>
  b.traverse(o=>{if(o.isMesh)targets.push(o);})
 );

 const hits=raycaster.intersectObjects(targets,false);
 if(!hits.length)return;

 let obj=hits[0].object;
 let bot=null;
 for(let b of bots){
  let p=obj;
  while(p&&p!==b)p=p.parent;
  if(p===b){bot=b;break;}
 }
 if(!bot||!bot.userData.alive)return;

 bot.userData.hp-=obj.position.y>1.5?70:45;
 if(bot.userData.hp<=0){
  bot.userData.alive=false;
  scene.remove(bot);
  score++;
  hud();

  if(bots.every(b=>!b.userData.alive)){
   running=false;
   document.exitPointerLock();
   showPanel(
    'ROUND WON','모든 적을 제압했습니다!',
    '다시 플레이',reset
   );
  }
 }
}

function reset(){
 player.x=0;player.z=27;
 player.yaw=Math.PI;player.pitch=0;
 player.hp=100;player.mag=25;player.reserve=100;
 camera.position.set(0,1.7,27);
 camera.rotation.set(0,Math.PI,0);
 score=0;time=90;
 spawnAll();hud();begin();
}

function blocked(x,z){
 return blockers.some(b=>
  Math.abs(x-b.x)<b.w/2+.45&&
  Math.abs(z-b.z)<b.d/2+.45
 );
}

function update(dt){
 if(!running)return;
 time-=dt;
 if(time<=0){
  time=0;running=false;
  document.exitPointerLock();
  showPanel('TIME UP','시간이 종료되었습니다.','다시 플레이',reset);
  return;
 }

 let dx=0,dz=0;
 const forward=new THREE.Vector3(
  -Math.sin(player.yaw),0,-Math.cos(player.yaw)
 );
 const right=new THREE.Vector3(
  Math.cos(player.yaw),0,-Math.sin(player.yaw)
 );
 if(keys.KeyW){dx+=forward.x;dz+=forward.z}
 if(keys.KeyS){dx-=forward.x;dz-=forward.z}
 if(keys.KeyD){dx+=right.x;dz+=right.z}
 if(keys.KeyA){dx-=right.x;dz-=right.z}

 const length=Math.hypot(dx,dz)||1;
 const speed=(keys.ShiftLeft?8:5)*(player.dash>0?3:1);
 dx=dx/length*speed*dt;
 dz=dz/length*speed*dt;
 player.dash=Math.max(0,player.dash-dt);

 if(!blocked(player.x+dx,player.z))player.x+=dx;
 if(!blocked(player.x,player.z+dz))player.z+=dz;
 player.x=Math.max(-30,Math.min(30,player.x));
 player.z=Math.max(-30,Math.min(30,player.z));
 camera.position.set(player.x,1.7,player.z);

 bots.forEach(b=>{
  if(!b.userData.alive)return;
  const d=b.userData;
  const vx=player.x-b.position.x;
  const vz=player.z-b.position.z;
  const distance=Math.hypot(vx,vz);

  if(distance>5&&distance<27){
   const nx=b.position.x+vx/distance*dt;
   const nz=b.position.z+vz/distance*dt;
   if(!blocked(nx,b.position.z))b.position.x=nx;
   if(!blocked(b.position.x,nz))b.position.z=nz;
  }

  b.rotation.y=Math.atan2(vx,vz);
  d.fire-=dt;

  if(distance<19&&d.fire<=0){
   d.fire=1.5+Math.random()*1.5;
   if(Math.random()<.22){
    player.hp-=8;
    hud();
    if(player.hp<=0){
     player.hp=0;hud();running=false;
     document.exitPointerLock();
     showPanel('ELIMINATED','다시 도전해 보세요.','다시 플레이',reset);
    }
   }
  }
 });

 document.querySelector('#time').textContent=Math.ceil(time);
 if(dx||dz)gun.position.y=Math.sin(performance.now()*.012)*.012;
 else gun.position.y=0;
}

function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.04,(now-last)/1000);
 last=now;
 update(dt);
 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=root.clientWidth/root.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(root.clientWidth,root.clientHeight);
});

spawnAll();
hud();
requestAnimationFrame(loop);
</script>
</body>
</html>
